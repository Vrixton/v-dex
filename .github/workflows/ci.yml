name: CI

on:
  pull_request:
  push:
    branches: [main]

# Si subes un commit nuevo al mismo PR, cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lee la versión de pnpm del campo "packageManager" de package.json
      - uses: pnpm/action-setup@v4

      # Lee la versión de Node de .nvmrc, la misma que usas en local
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test
